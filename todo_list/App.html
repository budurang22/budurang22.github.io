<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/App.css" />
    <link rel="stylesheet" href="css/Editor.css" />
    <link rel="stylesheet" href="css/Header.css" />
    <link rel="stylesheet" href="css/List.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="App">
      <div class="Header">
        <h3>오늘의 Plan 😃</h3>
        <h1>new date 함수로 오늘 날짜 넣기</h1>
      </div>
      <form action="">
        <div class="Editor">
          <input type="text" placeholder="새로운 todo" />
          <button type="button">추가</button>
        </div>
      </form>

      <div class="List">
        <h4>Todo List 📝</h4>
        <input type="text" placeholder="검색어를 입력해주세요" />
        <div class="todos_wrapper">
          <div class="TodoItem">
            <input type="checkbox" />
            <div class="content">React study</div>
            <div class="date">2026. 10. 1</div>
            <button type="button">삭제</button>
          </div>

          <div class="TodoItem">
            <input type="checkbox" />
            <div class="content">친구만나기</div>
            <div class="date">2026. 10. 1</div>
            <button type="button">삭제</button>
          </div>

          <div class="TodoItem">
            <input type="checkbox" />
            <div class="content">낮잠자기</div>
            <div class="date">2026. 10. 1</div>
            <button type="button">삭제</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
